# Header cho trang API docs (/docs, /redoc, /openapi.json) — thay cho security-headers.conf ở các location này.
# Swagger UI và ReDoc của FastAPI tải JS/CSS từ cdn.jsdelivr.net, có script inline, ReDoc dùng font Google và
# web worker (blob:), nên CSP nới hơn trang ứng dụng. Backend chỉ phục vụ docs khi PA_API_DOCS=true.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Cache-Control "no-cache" always;
