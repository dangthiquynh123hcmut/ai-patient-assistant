upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Audio cho STT tối đa 10 MB (backend tự giới hạn), cộng phần multipart.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Một lượt agent (LLM + tool + sửa lỗi) có thể mất vài chục giây.
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://backend/health;
    }

    # Healthcheck của chính container nginx (không phụ thuộc backend).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # File build có hash trong tên -> cache lâu dài.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: mọi route của React trả về index.html; index.html không cache để deploy mới có hiệu lực ngay.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
