# Chạy toàn bộ hệ thống: docker compose up -d --build   ->  http://localhost:8080
# Chạy test (cần Postgres, chạy trong container): docker compose run --rm --build test
# Biến cấu hình đọc từ file .env (xem .env.example, phần "Docker compose").
name: patient-assistant

x-backend-env: &backend-env
  PA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patient}:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-patient_assistant}
  # Schema do service migrate (Alembic) quản lý; backend không tự tạo bảng / nạp dữ liệu.
  PA_AUTO_CREATE_SCHEMA: "false"
  PA_SEED_DEMO_DATA: "false"
  PA_TIMEZONE: ${PA_TIMEZONE:-Asia/Ho_Chi_Minh}
  PA_SEED_PASSWORD: ${PA_SEED_PASSWORD:-demo1234}
  PA_SESSION_TTL_HOURS: ${PA_SESSION_TTL_HOURS:-12}
  PA_ALLOW_REGISTRATION: ${PA_ALLOW_REGISTRATION:-true}
  PA_COOKIE_SECURE: ${PA_COOKIE_SECURE:-false}
  PA_LLM_MODEL_ID: ${PA_LLM_MODEL_ID:-global.anthropic.claude-opus-4-6-v1}
  PA_AWS_REGION: ${PA_AWS_REGION:-ap-southeast-1}
  AWS_PROFILE: ${AWS_PROFILE:-default}
  PA_STT_ENABLED: ${PA_STT_ENABLED:-false}
  PA_STT_MODEL: ${PA_STT_MODEL:-small}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-patient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Chỉ mở cho máy này (localhost) để dùng psql / công cụ DB / chạy backend ngoài Docker.
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]

  # Chạy một lần mỗi lần `up`: áp migration rồi nạp/bổ sung dữ liệu demo (idempotent).
  migrate:
    build:
      context: .
      args:
        # Bật STT thì đặt BACKEND_EXTRAS=stt trong .env (cài faster-whisper vào image backend).
        EXTRAS: ${BACKEND_EXTRAS:-}
    image: patient-assistant-backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m patient_assistant.interface.cli.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: patient-assistant-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Tải model Whisper qua HTTP thường: giao thức Xet của HuggingFace bị treo ở 0 byte trên một số mạng.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      # Credential AWS cho Bedrock (IAM), chỉ đọc. Không dùng Bedrock thì để nguyên cũng được.
      - ${AWS_CONFIG_DIR:-~/.aws}:/home/app/.aws:ro
      # Model Whisper tải về ở lần nhận dạng giọng nói đầu tiên; giữ lại qua các lần build/khởi động lại.
      - stt-models:/home/app/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  # Test chạy trong container (Linux) với Postgres thật: mỗi test một schema riêng, xóa khi xong.
  # Mã nguồn được mount vào nên sửa code không cần build lại; đổi dependency thì thêm --build.
  test:
    profiles: ["test"]
    build:
      context: .
      args:
        EXTRAS: dev
    image: patient-assistant-test
    environment:
      PA_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patient}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-patient_assistant}_test
      PYTHONPATH: /work/src
    working_dir: /work
    volumes:
      - .:/work
    user: root
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: patient-assistant-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  stt-models:
