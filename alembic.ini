# Alembic: quản lý schema database. URL lấy từ PA_DATABASE_URL (cùng cấu hình với app), không ghi ở đây.
#   alembic upgrade head                       # áp mọi migration
#   alembic revision --autogenerate -m "..."   # sinh migration mới từ thay đổi trong sql/models.py
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
